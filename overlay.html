<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:'Segoe UI',sans-serif;overflow:hidden}#card{position:absolute;left:0;top:0;overflow:hidden;transition:opacity .2s}#card.empty{opacity:0}#avatar{position:absolute;display:grid;place-items:center;overflow:hidden;background:#294f3f;color:white}#avatar svg{width:40%;height:40%}#avatar img{width:100%;height:100%;object-fit:cover}#title,#artist,#label{position:absolute;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}#title{font-weight:700}#artist{font-weight:400}#label{font-size:10px;font-weight:700;letter-spacing:1.7px}#card.anim-slide.enter{animation:slideIn var(--speed) ease both}#card.anim-fade.enter{animation:fadeIn var(--speed) ease both}#card.anim-pop.enter{animation:popIn var(--speed) ease both}@keyframes slideIn{from{opacity:0;transform:translateX(-35px)}to{opacity:1;transform:translateX(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}#pause{position:absolute;right:12px;top:10px;font-size:10px;font-weight:700;letter-spacing:1px;color:white;background:#0008;border-radius:5px;padding:3px 6px}</style></head><body><div id="card" class="empty"><div id="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18V5l10-2v13M9 18c0 1.7-4 2.5-4 .4S9 16 9 18Zm10-2c0 1.7-4 2.5-4 .4s4-2.4 4-.4Z"/></svg></div><div id="label">СЕЙЧАС ИГРАЕТ</div><div id="pause" hidden>НА ПАУЗЕ</div><div id="title"></div><div id="artist"></div></div><audio id="audio" preload="auto"></audio><script>
const $=s=>document.querySelector(s),player=$('#audio');let id='',cover='',last=null;const icon=$('#avatar').innerHTML;
function rgba(hex,op){let n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${Math.max(0,Math.min(100,op))/100})`}
function style(w){let c=$('#card');c.style.width=w.width+'px';c.style.height=w.height+'px';c.style.background=rgba(w.bg,w.opacity);c.style.borderRadius=w.radius+'px';let a=$('#avatar');a.style.left=w.avatarX+'px';a.style.top=w.avatarY+'px';a.style.width=a.style.height=w.avatarSize+'px';a.style.borderRadius=Math.round(w.radius*.65)+'px';for(let name of ['title','artist']){let el=$('#'+name);el.style.left=w[name+'X']+'px';el.style.top=w[name+'Y']+'px';el.style.fontSize=w[name+'Size']+'px';el.style.maxWidth=Math.max(30,w.width-w[name+'X']-8)+'px'}$('#title').style.color=w.text;$('#artist').style.color=w.secondary;let l=$('#label');l.style.display=w.label?'block':'none';l.style.left=w.titleX+'px';l.style.top=Math.max(0,w.titleY-19)+'px';l.style.color=w.accent}
function apply(d){let changed=id!==d.id;if(changed){let c=$('#card');c.className='anim-'+(d.widgetAnim||'slide');c.style.setProperty('--speed',(d.animSpeed||450)+'ms');void c.offsetWidth;c.classList.add('enter')}$('#pause').hidden=d.playing||!d.hasTrack;if(new URLSearchParams(location.search).has('preview')&&!d.hasTrack)d={...d,hasTrack:true,title:'Название трека',artist:'Исполнитель'};last=d;style(d.widget);$('#card').classList.toggle('empty',!d.hasTrack);$('#title').textContent=d.title;$('#artist').textContent=d.artist;if(cover!==d.cover){cover=d.cover;let a=$('#avatar');if(cover){let img=document.createElement('img');img.src=cover;img.onerror=()=>a.innerHTML=icon;a.replaceChildren(img)}else a.innerHTML=icon}if(id!==d.id){id=d.id;player.pause();if(id){player.src='/audio?id='+encodeURIComponent(id);player.load()}else{player.removeAttribute('src');player.load()}}player.volume=Math.min(1,Math.max(0,d.volume/100));if(new URLSearchParams(location.search).has('preview')||!d.obsSound||!d.playing||!d.id){player.pause();return}let target=Math.max(0,d.position||0);if(Number.isFinite(player.duration))target=Math.min(target,Math.max(0,player.duration-.1));if(Number.isFinite(target)&&Math.abs(player.currentTime-target)>1.5){try{player.currentTime=target}catch{}}if(player.paused)player.play().catch(()=>{});}
const es=new EventSource('/events');es.onmessage=e=>apply(JSON.parse(e.data));player.addEventListener('loadedmetadata',()=>{if(last)apply(last)});</script></body></html>
