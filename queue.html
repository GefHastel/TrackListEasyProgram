<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:transparent;font:14px 'Segoe UI',sans-serif;color:white}.card{width:360px;padding:18px 20px;border-radius:16px;background:rgba(17,28,25,.90);animation:appear var(--duration,450ms) ease both}.top{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:1.7px;color:#60e3a3;margin-bottom:12px}.row{display:flex;gap:11px;align-items:center;padding:9px 0;border-top:1px solid #ffffff1e}.n{font-size:11px;color:#7b9887;width:22px}.info{min-width:0}.title{font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.artist{color:#a6b8ad;font-size:12px;margin-top:3px}.pause{color:#fff9;letter-spacing:0}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}</style></head><body><div id="card" class="card"><div class="top"><span>ОЧЕРЕДЬ ТРЕКОВ</span><span id="status" class="pause"></span></div><div id="rows"></div></div><script>const $=s=>document.querySelector(s);const e=new EventSource('/events');e.onmessage=x=>{let d=JSON.parse(x.data),w=d.widget,n=parseInt(w.bg.slice(1),16);$('#card').style.background=`rgba(${n>>16&255},${n>>8&255},${n&255},${w.opacity/100})`;$('#card').style.borderRadius=w.radius+'px';$('#card').style.setProperty('--duration',(d.animSpeed||450)+'ms');$('#card').style.animationName=d.widgetAnim==='off'?'none':'appear';$('.top').style.color=w.accent;$('#status').textContent=d.playing?'':'НА ПАУЗЕ';let r=$('#rows');r.replaceChildren();let q=d.queue.slice(d.current+1,d.current+6);if(!q.length){let text=document.createElement('div');text.className='artist';text.textContent=d.queue.length?'Далее треков нет':'Плейлист пуст';r.append(text)}q.forEach(t=>{let row=document.createElement('div');row.className='row';let no=document.createElement('span');no.className='n';no.textContent=String(t.index).padStart(2,'0');let info=document.createElement('div');info.className='info';let title=document.createElement('div');title.className='title';title.textContent=t.title;title.style.color=w.text;let artist=document.createElement('div');artist.className='artist';artist.style.color=w.secondary;artist.textContent=t.artist;info.append(title,artist);row.append(no,info);r.append(row)})};</script></body></html>
