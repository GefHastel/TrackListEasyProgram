<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>body{margin:0;background:transparent;font:700 28px 'Segoe UI',sans-serif;color:white}#line{display:inline-block;max-width:740px;padding:12px 20px;border-radius:12px;text-shadow:0 2px 6px #0009;transition:opacity .25s;white-space:pre-wrap}#line.animate{animation:show var(--duration,450ms) ease both}@keyframes show{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}#pause{font-size:11px;letter-spacing:1px;display:block;opacity:.7}</style></head><body><div id="line" hidden><span id="pause" hidden>НА ПАУЗЕ</span><span id="text"></span></div><script>let state=null,at=0,cues=[],previous='';function parse(s){let arr=[];for(let line of (s||'').split(/\r?\n/)){let m=/^\s*\[(\d+):(\d{1,2}(?:[.,]\d+)?)\]\s*(.*)$/.exec(line);if(m)arr.push({t:+m[1]*60+parseFloat(m[2].replace(',','.')),s:m[3]})}return arr.sort((a,b)=>a.t-b.t)}function draw(){if(!state)return;let t=state.position+(state.playing?(Date.now()-at)/1000:0),cue=cues.filter(x=>x.t<=t).pop(),box=document.querySelector('#line');box.hidden=!state.subtitles||!cue||!cue.s;let value=cue?.s||'';if(value!==previous){previous=value;box.classList.remove('animate');if(state.widgetAnim!=='off'){box.style.setProperty('--duration',(state.animSpeed||450)+'ms');void box.offsetWidth;box.classList.add('animate')}}document.querySelector('#text').textContent=value;document.querySelector('#pause').hidden=state.playing;let w=state.widget,n=parseInt(w.bg.slice(1),16);box.style.background=`rgba(${n>>16&255},${n>>8&255},${n&255},${w.opacity/100})`;box.style.color=w.text}let e=new EventSource('/events');e.onmessage=x=>{state=JSON.parse(x.data);at=Date.now();cues=parse(state.lyrics);draw()};setInterval(draw,100);</script></body></html>
